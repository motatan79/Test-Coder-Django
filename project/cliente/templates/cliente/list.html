{<div style="display: flex; gap: 32px; margin-top: 80px; flex-wrap: wrap; justify-content: center;">

    <!-- 🔹 Resultado IA -->
    <div style="flex: 1; min-width: 400px; max-width: 600px; display: flex; flex-direction: column; align-items: center;">
        <h3 style="text-align:center; margin-bottom:16px;">📋 Alineaciones</h3>
        {% if alineacion %}
        <div
            style="background:#fff; color:#222; border-radius:8px; padding:16px; width:100%; box-shadow:0 2px 8px rgba(0,0,0,0.08); flex-grow:1;">
            <pre id="alineacion-ia"
                style="white-space:pre-wrap; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 16px; color:#222; margin:0;">
                {{ alineacion|safe }}
            </pre>
        </div>
        {% else %}
        <div class="mx-auto my-3 p-3 text-center bg-white border rounded shadow-sm"
            style="width:100%; line-height:1.5; flex-grow:1;">
            <p class="text-muted mb-0">
                <em>
                    La alineación será generada una vez selecciones los jugadores<br>
                    y presiones <strong>"Crear Alineación"</strong>.
                </em>
            </p>
        </div>
        {% endif %}
    </div>

    <!-- 🔹 Cancha -->
    <div style="flex: 1; min-width: 400px; max-width: 600px; display: flex; flex-direction: column; align-items: center;">
        <h3 style="text-align:center; margin-bottom:16px;">🏟 Visualización de cancha</h3>
        <div class="cancha-container" style="width:100%; flex-grow:1; display:flex; justify-content:center;">
            <div class="cancha" style="max-width:500px; width:100%;">
                <div class="linea-centro"></div>
                <div class="circulo-centro"></div>
                <div class="area area-izq"></div>
                <div class="area area-der"></div>
                <div id="equipo-azul"></div>
            </div>
        </div>
    </div>

</div>
