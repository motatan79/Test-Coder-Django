{% extends 'core/base.html' %}

{% block content %}
<h2>Generar Alineación</h2>

<form method="post" action="">
  {% csrf_token %}
  <ul style="list-style: none; padding: 0;">
    {% for jugador in form.jugadores.field.queryset %}
      <li>
        <label>
          <input type="checkbox" name="jugadores" value="{{ jugador.pk }}">
          {{ jugador.nombre }} {{ jugador.apellido }} ({{ jugador.posicion1 }}, {{ jugador.posicion2 }})
        </label>
      </li>
    {% endfor %}
  </ul>

  <button type="submit" id="generar-btn" disabled>Generar</button>
</form>

{% if alineacion %}
  <h3>Resultado de la Alineación:</h3>
  <pre style="background-color: #f5f5f5; padding: 10px; border-radius: 5px;">
{{ alineacion }}
  </pre>
{% endif %}

<script>
// Habilitar el botón solo si se seleccionan exactamente 16 jugadores
const checkboxes = document.querySelectorAll('input[name="jugadores"]');
const btn = document.getElementById('generar-btn');

function actualizarBoton() {
  const seleccionados = Array.from(checkboxes).filter(chk => chk.checked).length;
  btn.disabled = seleccionados !== 16;
}

checkboxes.forEach(chk => chk.addEventListener('change', actualizarBoton));

// Ejecutar al cargar la página por si ya hay pre-selecciones
actualizarBoton();
</script>

{% endblock %}
