{% extends 'core/base.html' %}

{% block title %}
    Te La Armo | Register
{% endblock %}

{% block content %}
  <h1>Register</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{% url 'core:index' %}">

    <button type="submit" class="btn btn-primary">Registrar Usuario</button>
    <a href="{% url 'core:index' %}" class="btn btn-primary">Cancelar</a>
  </form>
{% endblock %}
