
{% extends 'core/base.html' %}
{% block content %}
<style>
    .alineacion-container {
        max-width: 700px;
        margin: 30px auto;
        background: #f8f9fa;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        padding: 32px 24px;
    }
    .alineacion-container h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 24px;
    }
    .alineacion-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 18px;
    }
    .alineacion-table th, .alineacion-table td {
        border: 1px solid #dee2e6;
        padding: 8px 10px;
        text-align: left;
    }
    .alineacion-table th {
        background: #e9ecef;
        color: #495057;
    }
    .alineacion-table tr:nth-child(even) {
        background: #f1f3f4;
    }
    .alineacion-btn {
        background: #007bff;
        color: #fff;
        border: none;
        padding: 10px 22px;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s;
    }
    .alineacion-btn:hover {
        background: #0056b3;
    }
    #resultado-ia {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        padding: 18px;
        margin-top: 20px;
    }
    @media (max-width: 600px) {
        .alineacion-container { padding: 12px 4px; }
        .alineacion-table th, .alineacion-table td { font-size: 0.95rem; }
    }
</style>
<div class="alineacion-container">
    <h2>Generar alineación de fútbol 8 con IA</h2>
    <form method="post">
        {% csrf_token %}
        <table class="alineacion-table">
            <tr>
                <th>Nombre del jugador</th>
                <th>Posición</th>
            </tr>
            {% for i in rango %}
            <tr>
                <td><input type="text" name="jugador{{i}}" required style="width: 98%; padding: 6px; border-radius: 4px; border: 1px solid #ced4da;"></td>
                <td>
                    <select name="posicion{{i}}" required style="width: 98%; padding: 6px; border-radius: 4px; border: 1px solid #ced4da;">
                        <option value="Portero">Portero</option>
                        <option value="Defensa">Defensa</option>
                        <option value="Mediocampo">Mediocampo</option>
                        <option value="Delantero">Delantero</option>
                    </select>
                </td>
            </tr>
            {% endfor %}
        </table>
        <button type="submit" class="alineacion-btn">Generar alineación</button>
        {% if alineacion %}
            <button type="button" class="alineacion-btn" onclick="document.getElementById('resultado-ia').style.display='block'">Ver resultado de la alineación</button>
        {% endif %}
    </form>
    {% if alineacion %}
        <div id="resultado-ia" style="display:none;">
            <h3 style="color:#007bff;">Alineación sugerida por IA:</h3>
            <pre style="font-size:1.1rem; background:#f8f9fa; border-radius:6px; padding:12px;">{{ alineacion }}</pre>
        </div>
    {% endif %}
</div>
{% endblock %}
