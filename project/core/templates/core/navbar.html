<!-- Responsive navbar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container px-5">
        <a class="navbar-brand" href="{% url 'core:index' %}">TeLaArmo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link {% if request.path == '/' %} active {% endif %}" aria-current="page" href="{% url 'core:index' %}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link {% if '/about/' in request.path %} active {% endif %}" href="{% url 'core:about' %}">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link {% if '/register/' in request.path %} active {% endif %}" href="{% url 'core:register' %}">Registrate</a></li>
                <li class="nav-item"><a class="nav-link {% if '/login/' in request.path %} active {% endif %}" href="{% url 'core:login' %}">Ingresa</a></li>
                {% if user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link {% if '/clientes/' in request.path %} active {% endif %}" href="{% url 'cliente:crear_equipo' %}">Equipos</a></li>
                    <li class="nav-item"><a class="nav-link text-bg-info">{{ user.username.capitalize }}</a></li>
                    <li class="nav-item">
                        <form action="{% url 'core:logout' %}" method="POST">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-dark">Logout</button>
                        </form>
                    </li>  
                    {% else %}
                            
                    {% endif %}
            </ul>
        </div>
    </div>
</nav>
